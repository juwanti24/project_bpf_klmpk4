<svg width="250" height="140" viewBox="0 0 250 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <path d="M 25 20 Q 20 15 25 10 Q 30 5 35 10 Q 40 15 45 13 Q 55 10 65 13 Q 75 15 85 13 Q 95 10 105 13 Q 115 15 125 13 Q 135 10 145 13 Q 155 15 165 13 Q 175 10 185 13 Q 190 15 185 20 Q 180 25 185 30 Q 190 35 185 40 Q 180 45 185 50 Q 190 55 185 60 Q 180 65 185 70 Q 190 75 185 80 Q 180 85 185 90 Q 190 95 185 100 Q 180 105 185 110 Q 190 115 185 120 Q 180 125 170 120 Q 160 115 150 120 Q 140 125 130 120 Q 120 115 110 120 Q 100 125 90 120 Q 80 115 70 120 Q 60 125 50 120 Q 40 115 30 120 Q 25 125 20 120 Q 15 115 20 110 Q 25 105 20 100 Q 15 95 20 90 Q 25 85 20 80 Q 15 75 20 70 Q 25 65 20 60 Q 15 55 20 50 Q 25 45 20 40 Q 15 35 20 30 Q 25 25 20 20 Q 15 15 20 10 Q 25 5 20 10 Q 15 15 20 20 Z" 
        fill="none" 
        stroke="#8B4513" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Plant (Monstera leaves) -->
  <g transform="translate(35, 60)">
    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="30" stroke="#6B8E23" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M 0 5 Q -10 12 -15 25 Q -12 30 -6 35 Q 0 32 0 28" 
          fill="#8FBC8F" 
          stroke="#6B8E23" 
          stroke-width="2" 
          stroke-linejoin="round"/>
    <!-- Right leaf -->
    <path d="M 0 12 Q 10 18 15 30 Q 12 35 6 40 Q 0 37 0 33" 
          fill="#8FBC8F" 
          stroke="#6B8E23" 
          stroke-width="2" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Coffee Cup -->
  <g transform="translate(100, 85)">
    <!-- Cup body -->
    <ellipse cx="0" cy="0" rx="22" ry="6" fill="#F5DEB3" stroke="#8B4513" stroke-width="2.5"/>
    <rect x="-22" y="-6" width="44" height="25" rx="4" fill="#F5DEB3" stroke="#8B4513" stroke-width="2.5"/>
    <!-- Coffee liquid -->
    <ellipse cx="0" cy="-2" rx="20" ry="5" fill="#654321"/>
    <!-- Handle -->
    <path d="M 22 -2 Q 30 -2 30 6 Q 30 10 26 10 Q 24 10 22 6" 
          fill="none" 
          stroke="#8B4513" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Steam/Aroma -->
  <g transform="translate(120, 60)">
    <!-- Main steam swirl (forming '2' shape) -->
    <path d="M 0 0 Q 6 -6 10 -12 Q 12 -18 10 -25 Q 6 -30 0 -30 Q -6 -30 -10 -25 Q -12 -18 -10 -12 Q -6 -6 0 0" 
          fill="none" 
          stroke="#A0522D" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
    <!-- Left steam -->
    <path d="M -12 0 Q -15 -6 -12 -12 Q -10 -18 -6 -22" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <!-- Right steam -->
    <path d="M 12 0 Q 15 -6 12 -12 Q 10 -18 6 -22" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Heart -->
  <g transform="translate(140, 40)">
    <path d="M 0 0 Q -4 -4 -4 -8 Q -4 -12 0 -16 Q 4 -12 4 -8 Q 4 -4 0 0" 
          fill="#CD5C5C" 
          stroke="#8B4513" 
          stroke-width="1.5"/>
    <path d="M 0 0 Q 4 -4 4 -8 Q 4 -12 0 -16 Q -4 -12 -4 -8 Q -4 -4 0 0" 
          fill="#CD5C5C" 
          stroke="#8B4513" 
          stroke-width="1.5"/>
  </g>
  
  <!-- Sparkles -->
  <g transform="translate(110, 35)">
    <path d="M 0 -5 L 0 5 M -5 0 L 5 0" 
          stroke="#CD5C5C" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
  </g>
  <g transform="translate(155, 48)">
    <path d="M 0 -4 L 0 4 M -4 0 L 4 0" 
          stroke="#CD5C5C" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Text: Ruang Rasa (Handwritten style) -->
  <text x="125" y="135" 
        font-family="'Kalam', 'Comic Sans MS', 'Marker Felt', 'Bradley Hand', 'Brush Script MT', cursive" 
        font-size="26" 
        font-weight="600" 
        fill="#8B4513" 
        text-anchor="middle"
        style="letter-spacing: 1px;">
    Ruang Rasa
  </text>
</svg>

