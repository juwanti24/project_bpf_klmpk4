<svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame -->
  <path d="M 20 15 Q 15 10 20 5 Q 25 0 30 5 Q 35 10 40 8 Q 50 5 60 8 Q 70 10 80 8 Q 90 5 100 8 Q 110 10 120 8 Q 130 5 140 8 Q 150 10 160 8 Q 170 5 180 8 Q 185 10 180 15 Q 175 20 180 25 Q 185 30 180 35 Q 175 40 180 45 Q 185 50 180 55 Q 175 60 180 65 Q 185 70 180 75 Q 175 80 180 85 Q 185 90 180 95 Q 175 100 180 105 Q 185 110 180 115 Q 175 120 170 115 Q 160 110 150 115 Q 140 120 130 115 Q 120 110 110 115 Q 100 120 90 115 Q 80 110 70 115 Q 60 120 50 115 Q 40 110 30 115 Q 25 120 20 115 Q 15 110 20 105 Q 25 100 20 95 Q 15 90 20 85 Q 25 80 20 75 Q 15 70 20 65 Q 25 60 20 55 Q 15 50 20 45 Q 25 40 20 35 Q 15 30 20 25 Q 25 20 20 15 Z" 
        fill="none" 
        stroke="#8B4513" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Plant (Monstera leaves) -->
  <g transform="translate(30, 50)">
    <!-- Stem -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="#6B8E23" stroke-width="2" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M 0 5 Q -8 10 -12 20 Q -10 25 -5 30 Q 0 28 0 25" 
          fill="#8FBC8F" 
          stroke="#6B8E23" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    <!-- Right leaf -->
    <path d="M 0 10 Q 8 15 12 25 Q 10 30 5 35 Q 0 33 0 30" 
          fill="#8FBC8F" 
          stroke="#6B8E23" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- Coffee Cup -->
  <g transform="translate(85, 70)">
    <!-- Cup body -->
    <ellipse cx="0" cy="0" rx="18" ry="5" fill="#F5DEB3" stroke="#8B4513" stroke-width="2"/>
    <rect x="-18" y="-5" width="36" height="20" rx="3" fill="#F5DEB3" stroke="#8B4513" stroke-width="2"/>
    <!-- Coffee liquid -->
    <ellipse cx="0" cy="-2" rx="16" ry="4" fill="#654321"/>
    <!-- Handle -->
    <path d="M 18 -2 Q 25 -2 25 5 Q 25 8 22 8 Q 20 8 18 5" 
          fill="none" 
          stroke="#8B4513" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Steam/Aroma -->
  <g transform="translate(100, 50)">
    <!-- Main steam swirl (forming '2' shape) -->
    <path d="M 0 0 Q 5 -5 8 -10 Q 10 -15 8 -20 Q 5 -25 0 -25 Q -5 -25 -8 -20 Q -10 -15 -8 -10 Q -5 -5 0 0" 
          fill="none" 
          stroke="#A0522D" 
          stroke-width="2" 
          stroke-linecap="round"/>
    <!-- Left steam -->
    <path d="M -10 0 Q -12 -5 -10 -10 Q -8 -15 -5 -18" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
    <!-- Right steam -->
    <path d="M 10 0 Q 12 -5 10 -10 Q 8 -15 5 -18" 
          fill="none" 
          stroke="#D2691E" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Heart -->
  <g transform="translate(115, 35)">
    <path d="M 0 0 Q -3 -3 -3 -6 Q -3 -9 0 -12 Q 3 -9 3 -6 Q 3 -3 0 0" 
          fill="#CD5C5C" 
          stroke="#8B4513" 
          stroke-width="1"/>
    <path d="M 0 0 Q 3 -3 3 -6 Q 3 -9 0 -12 Q -3 -9 -3 -6 Q -3 -3 0 0" 
          fill="#CD5C5C" 
          stroke="#8B4513" 
          stroke-width="1"/>
  </g>
  
  <!-- Sparkles -->
  <g transform="translate(90, 30)">
    <path d="M 0 -4 L 0 4 M -4 0 L 4 0" 
          stroke="#CD5C5C" 
          stroke-width="2" 
          stroke-linecap="round"/>
  </g>
  <g transform="translate(130, 40)">
    <path d="M 0 -3 L 0 3 M -3 0 L 3 0" 
          stroke="#CD5C5C" 
          stroke-width="1.5" 
          stroke-linecap="round"/>
  </g>
</svg>

